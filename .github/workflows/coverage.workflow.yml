name: Coverage

on:
  push:
    branches:
      - '**'

env:
  # Artifact name for coverage output
  CI_COVERAGE_ARTIFACT_FILE: coverage-${{ github.sha }}

jobs:
  test:
    name: test#node-${{ matrix.node_version }}#${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        node_version: ['24']
        os: [macOS-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # setup-node@v5 auto-caches via packageManager and needs pnpm on PATH first.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install NodeJS
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node_version }}
          cache: pnpm

      - name: Install dependencies
        shell: bash
        run: pnpm install

      - name: Run tests and collect coverage
        shell: bash
        run: pnpm ci:coverage
        env:
          # @see https://github.com/actions/runner-images/issues/70
          NODE_OPTIONS: '--max_old_space_size=4096'

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
